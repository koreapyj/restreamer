# restreamer daemon configuration
#
# Lookup order: $RESTREAMER_CONFIG -> ./config.yaml -> /etc/restreamer/config.yaml
# Every key is optional; an empty file yields the defaults shown below
# (which match current production).

# HTTP API bind address. Unauthenticated by contract — LAN-isolated only,
# same trust model as `rclone rcd --rc-no-auth`.
listen:
  host: 0.0.0.0
  port: 5580

# HLS output root; each session writes to <serveDir>/<name>/ (served by nginx).
serveDir: /media

# Persisted desired-state doc (atomic tmp+rename). The daemon reconciles from
# this at startup with zero controller involvement.
stateFile: /var/lib/restreamer/desired.json

# Local tvheadend instance; sessions stream /stream/channel/<uuid> from here.
# null = this host has no tvheadend (external/m3u-only zone) -- tvh-source
# sessions are then rejected all-or-nothing by PUT /v1/desired; url-source
# sessions are unaffected.
tvhBaseUrl: http://127.0.0.1:9981

# Local M3U catalog of external (non-tvheadend) sources, exposed to the
# controller via GET /v1/sources and re-read when its mtime changes.
# Give each #EXTINF a tvg-id so entry ids stay stable across renames
# (the controller stores the id as source_key). null = no catalog.
# sourcesM3u: /etc/restreamer/sources.m3u
sourcesM3u: null

# Subscription weight used when a session's source doesn't specify one
# (tvheadend preempts by weight; DVR wins).
defaultWeight: 100

# Child binaries.
ffmpegPath: ffmpeg
tsreadexPath: tsreadex

# Hardware capabilities advertised in /v1/status — the controller matches
# these against each pipeline template's requiredCaps.
capabilities:
  - qsv
  - opencl

# Per-session stderr ring-buffer size (GET /v1/sessions/:name/log).
logLines: 500

# No ffmpeg -progress update for this long while running -> restart, class 'stall'.
stallTimeoutSec: 30

# Playlist watchdog: restart when the media playlist's PROGRAM-DATE-TIME lags
# wall clock by more than this. null = derive per session (3 x hls_time + 15s).
playlistStallSec: null

# Proactive memory guard: if ffmpeg+tsreadex RSS exceeds this, restart the
# session (class 'oom-guard', failure counter reset). null = disabled.
memoryLimitMb: 2048

# Graceful stop: abort source -> wait this many seconds for ffmpeg to flush
# and exit -> SIGTERM -> SIGKILL after 5 more seconds.
stopGraceSec: 10

# Delete <serveDir>/<name>/ when a session is removed from the desired doc.
cleanupOnRemove: true

# Grace before that deletion, so a hot->cold swap keeps serving the outgoing
# session's HLS window while the switcher drains it.
#   null -> derive per-session from hls.segmentSeconds x hls.listSize (capped 1h)
#   0    -> delete immediately (legacy)
#   N    -> fixed override in seconds
# Ignored when cleanupOnRemove is false.
cleanupDelaySec: null
