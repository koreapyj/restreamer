# Release pipeline for both deployables, gated on one shared test run:
#   - the DAEMON as a self-contained Debian package (bundled Node runtime)
#   - the SWITCHER as a container image on GHCR (deploy/switcher.Dockerfile)
#
# Version scheme (package.json is the source of truth for the code-reported
# version, so a release tag must agree with it):
#   tag vX.Y.Z      -> deb version X.Y.Z; the test job FAILS if the tag does
#                      not match package.json "version"
#   push to main /  -> deb version <pkgver>~git<run_number>.<shortsha>
#   workflow_dispatch  ('~' sorts before the release, so the next real
#                      X.Y.Z upgrades over any rolling build)
#
# Publishing matrix:
#   tag vX.Y.Z        -> deb attached to the GitHub release for that tag;
#                        image pushed as :X.Y.Z and :latest
#   push to main      -> deb attached to the rolling 'main-latest' prerelease
#                        (recreated each time so old assets don't pile up);
#                        image pushed as :main and :main-<shortsha>
#   workflow_dispatch -> on main: same as a main push; on any other ref: no
#                        release, image pushed as :dev-<shortsha> only
# Every run also uploads the deb as a workflow artifact, and only pushes the
# image after an on-runner /v1/healthz smoke test of both artifacts.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Shared gate: the full suite must pass before anything is packaged or
  # pushed. Also computes the version used by both artifacts.
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e

      - name: Compute version
        id: version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
              echo "::error::tag v$TAG_VERSION does not match package.json version $PKG_VERSION — bump package.json (the daemon reports it in /v1/status) and re-tag"
              exit 1
            fi
            VERSION="$PKG_VERSION"
          else
            VERSION="${PKG_VERSION}~git${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" | tee -a "$GITHUB_OUTPUT"

  deb:
    needs: test
    runs-on: ubuntu-latest # amd64: the deb bundles the linux-x64 Node runtime
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build deb
        run: bash scripts/build-deb.sh
        env:
          VERSION: ${{ needs.test.outputs.version }}

      - name: Smoke-test deb on the runner
        run: |
          set -euxo pipefail
          sudo dpkg -i out/*.deb

          # CI config: keep serveDir under the state dir the package owns
          # (the installed conffile defaults to /media, absent on the runner)
          sudo install -d -o restreamer -g restreamer /var/lib/restreamer/ci-media
          sudo tee /etc/restreamer/ci-smoke.yaml >/dev/null <<'EOF'
          listen:
            host: 127.0.0.1
            port: 5580
          serveDir: /var/lib/restreamer/ci-media
          EOF
          sudo mkdir -p /etc/systemd/system/restreamer.service.d
          sudo tee /etc/systemd/system/restreamer.service.d/ci.conf >/dev/null <<'EOF'
          [Service]
          Environment=RESTREAMER_CONFIG=/etc/restreamer/ci-smoke.yaml
          EOF
          sudo systemctl daemon-reload

          sudo systemctl start restreamer

          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5580/v1/healthz; then ok=1; break; fi
            sleep 1
          done
          echo
          if [[ "$ok" != 1 ]]; then
            sudo systemctl status restreamer --no-pager || true
            sudo journalctl -u restreamer --no-pager | tail -n 50
            exit 1
          fi
          sudo systemctl status restreamer --no-pager
          systemctl is-active --quiet restreamer

          sudo systemctl stop restreamer
          sudo rm -rf /etc/systemd/system/restreamer.service.d
          sudo dpkg -r restreamer
          ! systemctl is-active --quiet restreamer
          if dpkg -s restreamer 2>/dev/null | grep -q 'Status: install ok installed'; then
            echo '::error::restreamer still installed after dpkg -r'
            exit 1
          fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: restreamer-deb
          path: out/*.deb
          if-no-files-found: warn

  container:
    # switcher image -> GHCR. Built locally first, smoke-tested, and only
    # then pushed (the second build-push step reuses the buildx cache, so it
    # does not rebuild).
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Compute image name and tags
        id: meta
        run: |
          # GHCR requires a lowercase repository owner
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/restreamer-switcher"
          VERSION="${{ needs.test.outputs.version }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # VERSION == package.json version (enforced by the test job)
            TAGS="$IMAGE:$VERSION,$IMAGE:latest"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            TAGS="$IMAGE:main,$IMAGE:main-$SHORT_SHA"
          else
            # workflow_dispatch on a non-main ref: throwaway dev tag
            TAGS="$IMAGE:dev-$SHORT_SHA"
          fi
          {
            echo "image=$IMAGE"
            echo "tags=$TAGS"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only for now. To add arm64 later: add
      # docker/setup-qemu-action before buildx, set
      # platforms: linux/amd64,linux/arm64 on the PUSH step only (load: true
      # is single-platform — keep the smoke build/run amd64).
      - name: Build image (local, for smoke test)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/switcher.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: restreamer-switcher:smoke

      - name: Smoke-test image on the runner
        run: |
          set -euxo pipefail
          mkdir -p /tmp/switcher-smoke
          # no controller runs here: the link retries with backoff while
          # healthz (liveness) stays up — exactly the k8s controller-down shape
          cat > /tmp/switcher-smoke/switcher.yaml <<'EOF'
          listen:
            host: 0.0.0.0
            port: 5590
          controllerUrl: ws://127.0.0.1:1/ws/switcher
          EOF
          docker run -d --name switcher-smoke -p 127.0.0.1:5590:5590 \
            -v /tmp/switcher-smoke/switcher.yaml:/etc/restreamer/switcher.yaml:ro \
            restreamer-switcher:smoke

          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5590/v1/healthz; then ok=1; break; fi
            sleep 1
          done
          echo
          if [[ "$ok" != 1 ]]; then
            docker logs switcher-smoke || true
            docker rm -f switcher-smoke || true
            exit 1
          fi
          docker rm -f switcher-smoke

      - name: Push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/switcher.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  release:
    # proper release: attach the deb to the GitHub release for the tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: restreamer-deb
          path: out
      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: out/*.deb
          generate_release_notes: true

  prerelease:
    # rolling prerelease: recreate the fixed 'main-latest' tag/release so it
    # always carries exactly the newest main build
    if: github.ref == 'refs/heads/main'
    needs: [test, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: main-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: restreamer-deb
          path: out
      - name: Drop previous rolling release
        run: gh release delete main-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: main-latest
          name: Rolling build (main)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Automated rolling build of `main` (${{ github.sha }}),
            version `${{ needs.test.outputs.version }}`.
            Superseded by every push to main; prefer tagged releases.
          files: out/*.deb
