# Switcher deployment — HLS failover/splice service (see src/switcher/).
#
# Stateless replicas: each pod dials the controller over a persistent
# WebSocket (controllerLink.ts) and serves from the last doc it received in
# memory — there is no PVC and nothing to reconcile between pods. Scale
# `replicas` freely. A pod that hasn't received a doc yet fails readiness
# (`/v1/readyz`) and gets no traffic; one that has keeps serving through
# controller outages and rolling restarts alike, which is what makes
# maxUnavailable: 0 safe below.
#
# SECURITY: the /v1 API is unauthenticated by contract. Only the
# viewer-facing /hls path may be exposed through the Ingress; /v1 must stay
# cluster-internal (and ideally be limited to the controller with a
# NetworkPolicy, as for tvh-controller).
apiVersion: v1
kind: ConfigMap
metadata:
  name: switcher-config
data:
  # mounted at /etc/restreamer/switcher.yaml; $SWITCHER_CONFIG points here
  # (defaults shown — see switcher.example.yaml for the annotated version)
  switcher.yaml: |
    listen:
      host: 0.0.0.0
      port: 5590
    controllerUrl: ws://tvh-controller.CHANGEME.svc:PORT/ws/switcher
    cacheTtlMs: 2000
    probeIntervalMs: 15000
    stallGraceSec: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restreamer-switcher
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: restreamer-switcher
  template:
    metadata:
      labels:
        app: restreamer-switcher
    spec:
      # GHCR packages are PRIVATE by default. Either make the package public
      # (GitHub -> Packages -> restreamer-switcher -> package settings), or
      # create a pull secret and uncomment imagePullSecrets:
      #   kubectl create secret docker-registry ghcr-pull \
      #     --docker-server=ghcr.io --docker-username=<github-user> \
      #     --docker-password=<PAT with read:packages scope>
      # imagePullSecrets:
      #   - name: ghcr-pull
      containers:
        - name: switcher
          # CI publishes this image (.github/workflows/release.yml):
          #   tag vX.Y.Z -> :X.Y.Z and :latest; main -> :main and :main-<sha>
          image: ghcr.io/koreapyj/restreamer-switcher:0.1.0 # ← set your owner + a released version
          imagePullPolicy: IfNotPresent
          env:
            - name: SWITCHER_CONFIG
              value: /etc/restreamer/switcher.yaml
          ports:
            - containerPort: 5590
          volumeMounts:
            - name: config
              mountPath: /etc/restreamer
              readOnly: true
          livenessProbe:
            httpGet: { path: /v1/healthz, port: 5590 }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /v1/readyz, port: 5590 }
      volumes:
        - name: config
          configMap:
            name: switcher-config
---
apiVersion: v1
kind: Service
metadata:
  name: restreamer-switcher
spec:
  selector:
    app: restreamer-switcher
  ports:
    - port: 80
      targetPort: 5590
---
# Ingress skeleton. The host below must equal the `publicUrl` configured for
# this switcher in tvh-controller's `restreamer.switchers` block — redundant
# channels' M3U entries point at <publicUrl>/hls/<slug>/playlist.m3u8.
# Only /hls is routed; never expose /v1 publicly (unauthenticated API).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restreamer-switcher
  annotations:
    # each replica keeps its own served-window buffer per channel/variant, so
    # pin every request for a given playlist path to the same replica — a
    # re-hash on pod add/remove is a restart-equivalent virtual-sequence jump,
    # which players already tolerate.
    nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"
    # cert-manager.io/cluster-issuer: letsencrypt
spec:
  rules:
    - host: switcher.example.com # placeholder — set to the switcher publicUrl host
      http:
        paths:
          - path: /hls
            pathType: Prefix
            backend:
              service:
                name: restreamer-switcher
                port:
                  number: 80
  # tls:
  #   - hosts: [switcher.example.com]
  #     secretName: restreamer-switcher-tls
